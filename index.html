<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <h1 class="task-manager">Task Manager</h1>
        <p>Manage your daily tasks efficiently</p>
      </div>
      <div class="header-stats" id="header-stats">
        0 / 0 Completed
      </div>
    </header>

    <main>
      <section class="task-input-section">
        <form id="task-form" class="task-form">
          <div class="input-wrapper">
            <label for="task-name" class="sr-only">Task name</label>
            <input
              type="text"
              id="task-name"
              name="task"
              placeholder="What needs to be done today?"
              required
              autocomplete="off"
            />
          </div>
          <button type="submit" class="add-task btn-primary">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
            </svg>
            Add Task
          </button>
        </form>
      </section>

      <section class="task-list-section">
        <div class="list-header">
          <h2>Your Tasks</h2>
          <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
          </div>
        </div>
        
        <ul id="task-list" class="task-list">
          <!-- Tasks will be dynamically injected here -->
        </ul>
        
        <div id="empty-state" class="empty-state hidden">
          <svg width="64" height="64" fill="none" stroke="#cbd5e1" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
          </svg>
          <p>No tasks found. Start by adding one above!</p>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Allahverdi Hasanov | github.com/allahverdi-dev</p>
    </footer>
    
    <button id="top-button" class="top-button hidden" type="button" aria-label="Scroll to top">
      <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
      </svg>
    </button>
  </div>
  <script src="script.js"></script>
</body>
</html>
